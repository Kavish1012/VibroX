<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#080808">
<title>VibroX — Music Player</title>
<style>
:root{
  --bg:#050505;--side:#111;--card:#181818;--elev:#222;--text:#fff;--muted:#a7a7a7;
  --accent:#ff7a00;--accent2:#ffad66;--danger:#ff5c5c;--line:#2b2b2b;
  --player-h:88px;--radius:16px;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input{font:inherit}
button{border:0;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100vh;display:grid;grid-template-columns:240px 1fr;overflow:hidden}
.sidebar{background:linear-gradient(180deg,#151515,#0d0d0d);padding:20px 14px;display:flex;flex-direction:column;gap:20px;border-right:1px solid #1d1d1d;z-index:20}
.brand{display:flex;align-items:center;gap:11px;padding:5px 9px;font-weight:800;font-size:21px;letter-spacing:-.5px}
.logo{width:35px;height:35px;border-radius:11px;background:linear-gradient(135deg,#ff7a00,#b83b00);display:grid;place-items:center;box-shadow:0 8px 24px #ff7a002b}
.logo img{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}
.nav{display:grid;gap:6px}
.nav button{background:transparent;padding:12px 13px;border-radius:11px;display:flex;align-items:center;gap:13px;text-align:left;color:var(--muted);transition:.2s}
.nav button:hover,.nav button.active{background:#202020;color:#fff}
.nav button.active{box-shadow:inset 3px 0 var(--accent)}
.nav svg{width:20px;height:20px;flex:none}
.sidebar-spacer{flex:1}
.tip{font-size:12px;color:#777;line-height:1.5;padding:12px}
.main{min-width:0;overflow:auto;padding-bottom:var(--player-h)}
.topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;padding:18px 24px;background:linear-gradient(#080808ee,#080808bb,transparent);backdrop-filter:blur(12px)}
.search{flex:1;max-width:620px;position:relative}
.search input{width:100%;height:44px;background:#202020;border:1px solid #2c2c2c;color:#fff;border-radius:23px;padding:0 45px;font-size:14px}
.search svg{position:absolute;left:15px;top:12px;width:20px;color:#aaa}
.top-actions{margin-left:auto;display:flex;gap:8px}
.icon-btn{width:42px;height:42px;border-radius:50%;background:#1b1b1b;display:grid;place-items:center;transition:.2s}
.icon-btn:hover{background:#292929;transform:translateY(-1px)}
.icon-btn svg{width:19px}
.content{padding:0 24px 35px}
.hero{min-height:280px;border-radius:24px;padding:35px;display:flex;align-items:flex-end;position:relative;overflow:hidden;background:radial-gradient(circle at 85% 25%,#ff7a0099 0,#ff7a0022 25%,transparent 50%),linear-gradient(135deg,#222,#101010)}
.hero:after{content:"";position:absolute;width:360px;height:360px;right:-80px;bottom:-160px;border-radius:50%;background:#ff7a0020;filter:blur(30px)}
.hero-copy{position:relative;z-index:1;max-width:620px}
.eyebrow{color:var(--accent2);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:1.5px}
.hero h1{font-size:clamp(34px,5vw,66px);line-height:.98;margin:12px 0}
.hero p{color:#c7c7c7;margin:0 0 22px}
.hero-actions{display:flex;gap:10px}
.primary,.secondary{height:44px;padding:0 20px;border-radius:23px;font-weight:750;display:inline-flex;align-items:center;gap:8px;transition:.2s}
.primary{background:var(--accent);color:#160900}.primary:hover{background:#ff922e;transform:scale(1.02)}
.secondary{background:#ffffff14;border:1px solid #ffffff20}.secondary:hover{background:#ffffff22}
.section{margin-top:30px}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.section h2{font-size:22px;margin:0}
.section-head small{color:#888}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}
.card{background:var(--card);border-radius:14px;padding:13px;transition:.25s;min-width:0}
.card:hover{background:#202020;transform:translateY(-3px)}
.cover{aspect-ratio:1;border-radius:10px;overflow:hidden;background:linear-gradient(135deg,#ff7a00,#2a1408);position:relative;margin-bottom:11px}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.card .play-fab{position:absolute;right:9px;bottom:9px;width:43px;height:43px;border-radius:50%;background:var(--accent);color:#160900;display:grid;place-items:center;box-shadow:0 8px 18px #0008;opacity:0;transform:translateY(7px);transition:.2s}
.card:hover .play-fab,.card:focus-within .play-fab{opacity:1;transform:none}
.card-title{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-meta{font-size:12px;color:#999;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
.track-list{display:grid;gap:5px}
.track{display:grid;grid-template-columns:48px minmax(0,1fr) 170px 80px auto;align-items:center;gap:13px;padding:9px 10px;border-radius:10px;transition:.15s}
.track:hover{background:#191919}
.track-cover{width:48px;height:48px;border-radius:7px;object-fit:cover;background:#222}
.track-main{min-width:0}
.track-title{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track-artist{font-size:12px;color:#999;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track-album,.track-duration{color:#888;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track-actions{display:flex;justify-content:flex-end;gap:4px}
.small-btn{width:35px;height:35px;border-radius:50%;background:transparent;color:#999;display:grid;place-items:center}
.small-btn:hover{background:#292929;color:#fff}
.small-btn.liked{color:var(--accent)}
.empty{border:1px dashed #333;border-radius:18px;padding:48px 20px;text-align:center;color:#8d8d8d}
.empty strong{display:block;color:#eee;font-size:17px;margin-bottom:8px}
.empty button{margin-top:18px}
.page-title{font-size:32px;margin:20px 0 6px}.page-sub{color:#888;margin:0 0 25px}
.admin-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,420px);gap:20px}
.panel{background:var(--card);border:1px solid #242424;border-radius:18px;padding:22px}
.form{display:grid;gap:15px}
.field{display:grid;gap:7px}
.field label{font-size:13px;color:#ccc;font-weight:650}
.field input{height:44px;border-radius:10px;background:#101010;border:1px solid #303030;color:#fff;padding:0 12px}
.file-box{border:1px dashed #3a3a3a;border-radius:13px;padding:15px;background:#101010}
.file-box input{width:100%;color:#aaa}
.preview{width:100%;max-width:180px;aspect-ratio:1;border-radius:12px;object-fit:cover;background:#222;display:none;margin-top:10px}
.library-row{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid #252525}
.library-row:last-child{border:0}.library-row img{width:52px;height:52px;border-radius:8px;object-fit:cover}.library-row small{color:#888;display:block;margin-top:3px}
.danger{background:#2b1111;color:#ff8d8d}.danger:hover{background:#421515}
.player{position:fixed;left:240px;right:0;bottom:0;height:var(--player-h);background:#101010f5;border-top:1px solid #2b2b2b;backdrop-filter:blur(18px);z-index:30;display:grid;grid-template-columns:minmax(210px,1fr) minmax(300px,1.5fr) minmax(180px,1fr);align-items:center;padding:10px 18px;gap:15px}
.now{display:flex;align-items:center;gap:11px;min-width:0}.now img{width:56px;height:56px;border-radius:8px;object-fit:cover;background:#222}.now-copy{min-width:0}.now-title,.now-artist{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.now-title{font-weight:700;font-size:13px}.now-artist{font-size:11px;color:#999;margin-top:3px}
.player-center{display:grid;gap:6px;min-width:0}.controls{display:flex;justify-content:center;align-items:center;gap:9px}.control{width:31px;height:31px;border-radius:50%;background:transparent;color:#aaa;display:grid;place-items:center}.control:hover{color:#fff}.control.active{color:var(--accent)}.play-main{width:38px;height:38px;background:#fff;color:#000}.play-main:hover{transform:scale(1.05);background:#eee}.control svg{width:17px;height:17px}
.progress-row{display:grid;grid-template-columns:38px 1fr 38px;align-items:center;gap:8px;color:#999;font-size:10px}.range{height:4px;width:100%;appearance:none;background:#4a4a4a;border-radius:4px;outline:none}.range::-webkit-slider-thumb{appearance:none;width:12px;height:12px;border-radius:50%;background:#fff;opacity:0;transition:.15s}.range:hover::-webkit-slider-thumb{opacity:1}.range::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:#fff}
.player-right{display:flex;justify-content:flex-end;align-items:center;gap:8px}.volume{width:100px}
.queue{position:fixed;right:0;top:0;bottom:var(--player-h);width:360px;background:#121212;z-index:25;border-left:1px solid #292929;transform:translateX(105%);transition:.3s;box-shadow:-20px 0 50px #0008;overflow:auto;padding:20px}.queue.open{transform:none}
.queue-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.queue h2{margin:0;font-size:20px}.queue h3{font-size:12px;color:#888;text-transform:uppercase;letter-spacing:1px;margin:20px 0 10px}.queue-item{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:8px;border-radius:9px}.queue-item:hover{background:#202020}.queue-item img{width:44px;height:44px;border-radius:6px;object-fit:cover}.queue-item div{min-width:0}.queue-item b,.queue-item span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.queue-item span{font-size:11px;color:#888;margin-top:3px}.toast-wrap{position:fixed;right:20px;bottom:105px;z-index:80;display:grid;gap:8px}.toast{background:#242424;border:1px solid #393939;color:#fff;border-radius:10px;padding:11px 14px;box-shadow:0 10px 30px #0008;animation:toastIn .25s ease,toastOut .25s ease 2.75s forwards;font-size:13px}
.modal-backdrop{position:fixed;inset:0;background:#0009;backdrop-filter:blur(5px);z-index:70;display:none;place-items:center;padding:20px}.modal-backdrop.show{display:grid}.modal{width:min(460px,100%);background:#1a1a1a;border:1px solid #333;border-radius:18px;padding:22px;box-shadow:0 25px 80px #000}
.modal h3{margin:0 0 9px}.modal p{color:#aaa;line-height:1.5}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.mobile-menu{display:none}
.hidden{display:none!important}
.spin{animation:spin 1s linear infinite}
@keyframes toastIn{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
@keyframes toastOut{to{transform:translateY(12px);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:1100px){
 .player{grid-template-columns:1fr 1.4fr}.player-right{display:none}
 .admin-grid{grid-template-columns:1fr}
 .track{grid-template-columns:48px minmax(0,1fr) 100px auto}.track-album{display:none}
}
@media(max-width:760px){
 :root{--player-h:104px}
 .app{display:block}
 .sidebar{position:fixed;left:0;right:0;bottom:0;height:62px;padding:5px 8px;display:block;border:0;background:#111f;backdrop-filter:blur(18px);z-index:50}
 .brand,.tip{display:none}.nav{display:flex;justify-content:space-around;gap:2px}.nav button{padding:7px 10px;display:flex;flex-direction:column;gap:3px;font-size:10px;justify-content:center;flex:1}.nav button.active{box-shadow:inset 0 -2px var(--accent)}
 .nav svg{width:19px;height:19px}
 .main{padding-bottom:calc(var(--player-h) + 62px)}
 .topbar{padding:12px 13px}.content{padding:0 13px 25px}
 .hero{min-height:290px;padding:24px}.hero h1{font-size:40px}
 .cards{display:flex;overflow:auto;margin-right:-13px;padding-right:13px}.card{min-width:155px}
 .track{grid-template-columns:44px minmax(0,1fr) auto;gap:9px}.track-cover{width:44px;height:44px}.track-duration{display:none}.track-actions .queue-add{display:none}
 .player{left:0;right:0;bottom:62px;height:var(--player-h);grid-template-columns:1fr;grid-template-rows:44px 40px;padding:7px 11px;gap:2px}
 .now{min-width:0}.now img{width:44px;height:44px}.now .like-player{margin-left:auto}
 .player-center{display:contents}.controls{position:absolute;right:8px;top:11px}.controls .secondary-control{display:none}.play-main{width:38px;height:38px}
 .progress-row{grid-template-columns:31px 1fr 31px;gap:5px}.player-right{display:none}
 .queue{left:0;width:100%;bottom:calc(var(--player-h) + 62px)}
 .toast-wrap{right:12px;left:12px;bottom:calc(var(--player-h) + 75px)}
 .search{max-width:none}.top-actions .hide-mobile{display:none}
 .admin-grid{gap:12px}.panel{padding:16px}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation:none!important;transition:none!important}}

.site-footer{margin:30px 24px 120px;padding:22px 4px;border-top:1px solid #242424;display:flex;gap:16px;align-items:center;flex-wrap:wrap;color:#888;font-size:12px}.site-footer b{color:#ff7a00;font-size:14px}.site-footer span:last-child{margin-left:auto;color:#aaa}.plus-btn{height:42px;padding:0 17px;border-radius:22px;font-size:13px;white-space:nowrap}.account-btn{height:44px;min-width:44px;padding:0 12px;border-radius:24px;background:#171717;border:1px solid #2b2b2b;color:#fff;display:flex;align-items:center;gap:7px;font-weight:700}.account-btn:hover{border-color:#ff7a00;background:#21160d}.account-icon{width:25px;height:25px;border-radius:50%;display:grid;place-items:center;background:#ff7a00;color:#160900;font-size:14px}.account-label{font-size:12px}.track.active-track{background:#21150c;border-left:3px solid #ff7a00}.playing-dot{width:8px;height:8px;border-radius:50%;background:#ff7a00;display:inline-block;margin-right:6px;box-shadow:0 0 10px #ff7a00}.uploaded-panel{margin-top:14px}.uploaded-panel[hidden]{display:none}.edit-form{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}.edit-form input{height:36px}.visualizer{height:28px;width:90px;display:flex;align-items:end;gap:3px}.visualizer i{width:4px;background:#ff7a00;border-radius:3px;animation:bars .65s ease-in-out infinite alternate}.visualizer i:nth-child(2){animation-delay:.12s}.visualizer i:nth-child(3){animation-delay:.25s}.visualizer i:nth-child(4){animation-delay:.08s}.visualizer i:nth-child(5){animation-delay:.2s}@keyframes bars{from{height:5px}to{height:25px}}
@media(max-width:760px){.site-footer{margin:20px 13px 125px}.site-footer span:last-child{margin-left:0}.account-label{display:none}.plus-btn{height:38px;padding:0 13px}.top-actions{gap:6px}.topbar{align-items:center}.edit-form{grid-template-columns:1fr}}
</style>

<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><div class="logo" aria-hidden="true"><img src="Logo VibroX.png" alt="VibroX logo"></div><span>VibroX</span></div>
  <nav class="nav" id="nav">
    <button data-section="home" class="active" aria-label="Home"><svg viewBox="0 0 24 24" fill="none"><path d="m3 11 9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" stroke="currentColor" stroke-width="2"/></svg><span>Home</span></button>
    <button data-section="liked" aria-label="Liked Songs"><svg viewBox="0 0 24 24" fill="none"><path d="M20.8 8.6c0 5.2-8.8 10-8.8 10s-8.8-4.8-8.8-10A4.6 4.6 0 0 1 12 6.2 4.6 4.6 0 0 1 20.8 8.6Z" stroke="currentColor" stroke-width="2"/></svg><span>Liked</span></button>
    <button data-section="queue" aria-label="Queue"><svg viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h10M4 18h7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="m17 14 3 3-3 3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Queue</span></button>
  </nav>
  <div class="sidebar-spacer"></div>
  <div class="tip">VibroX Music Player · Made by KavishJ.</div>
</aside>

<main class="main" id="main">
<header class="topbar">
  <div class="search">
    <svg viewBox="0 0 24 24" fill="none"><circle cx="10.8" cy="10.8" r="6.8" stroke="currentColor" stroke-width="2"/><path d="m16 16 5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <input id="search" type="search" placeholder="Search songs, artists, albums..." aria-label="Search music">
  </div>
  <div class="top-actions">
    <button class="primary plus-btn" id="getPlus" type="button">Get Plus</button>
    <button class="account-btn" id="accountBtn" type="button" aria-label="Open account">
      <span class="account-icon">⌂</span><span class="account-label">Account</span>
    </button>
  </div>
</header>
<div class="content" id="content"></div><footer class="site-footer"><b>VIBROX</b><span>Music Player</span><span>Made by KavishJ.</span></footer>
</main>
</div>

<section class="queue" id="queuePanel" aria-label="Queue panel">
  <div class="queue-head"><h2>Up Next</h2><button class="icon-btn" id="closeQueue" aria-label="Close queue">×</button></div>
  <div id="queueContent"></div>
</section>

<footer class="player">
  <div class="now">
    <img id="playerCover" alt="Current track cover">
    <div class="now-copy"><div class="now-title" id="playerTitle">Nothing playing</div><div class="now-artist" id="playerArtist">Choose a song to begin</div></div>
    <button class="control like-player" id="playerLike" aria-label="Like current song"><svg viewBox="0 0 24 24" fill="none"><path d="M20.8 8.6c0 5.2-8.8 10-8.8 10s-8.8-4.8-8.8-10A4.6 4.6 0 0 1 12 6.2 4.6 4.6 0 0 1 20.8 8.6Z" stroke="currentColor" stroke-width="2"/></svg></button>
  </div>
  <div class="player-center">
    <div class="controls">
      <button class="control secondary-control" id="shuffleBtn" aria-label="Shuffle"><svg viewBox="0 0 24 24" fill="none"><path d="M4 7h2c4 0 6 10 10 10h4M16 5l4 2-4 2M4 17h2c1.5 0 2.7-.9 3.6-2M16 17l4 2-4 2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="control" id="prevBtn" aria-label="Previous"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zm3 7 9-7v14z"/></svg></button>
      <button class="control play-main" id="playBtn" aria-label="Play"><svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
      <button class="control" id="nextBtn" aria-label="Next"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM6 5l9 7-9 7z"/></svg></button>
      <button class="control secondary-control" id="repeatBtn" aria-label="Repeat mode"><svg viewBox="0 0 24 24" fill="none"><path d="M7 7h10l-2-2m2 2-2 2M17 17H7l2 2m-2-2 2-2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
    <div class="progress-row"><span id="currentTime">0:00</span><input class="range" id="progress" type="range" min="0" max="100" value="0" step=".1" aria-label="Seek"><span id="totalTime">0:00</span></div>
  </div>
  <div class="player-right">
    <button class="control" id="muteBtn" aria-label="Mute"><svg id="volumeIcon" viewBox="0 0 24 24" fill="none"><path d="M4 10v4h4l5 4V6l-5 4zM17 9a4 4 0 0 1 0 6M19.5 6.5a8 8 0 0 1 0 11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    <input class="range volume" id="volume" type="range" min="0" max="1" value="1" step=".01" aria-label="Volume">
    <button class="control" id="queueBtn" aria-label="Queue"><svg viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h10M4 18h7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="m17 14 3 3-3 3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
  </div>
</footer>

<div class="toast-wrap" id="toasts"></div>
<div class="modal-backdrop" id="modal">
  <div class="modal" role="dialog" aria-modal="true">
    <h3 id="modalTitle">Confirm</h3><p id="modalText"></p>
    <div class="modal-actions"><button class="secondary" id="modalCancel">Cancel</button><button class="primary danger" id="modalConfirm">Delete</button></div>
  </div>
</div>
<audio id="audio" preload="metadata"></audio>

async function uploadCloudFile(path,file){
  if(!cloudAvailable())throw new Error("Supabase library did not load. Refresh the page and try again.");
  if(!file)throw new Error("No file selected.");
  const bucket=supabaseClient.storage.from(SUPABASE_BUCKET);
  const {error}=await bucket.upload(path,file,{upsert:true,contentType:file.type||"application/octet-stream",cacheControl:"3600"});
  if(error){
    const msg=error.message||"Storage upload failed.";
    if(/bucket/i.test(msg)) throw new Error(`Storage bucket \"${SUPABASE_BUCKET}\" is missing or not accessible. Create a PUBLIC bucket named \"${SUPABASE_BUCKET}\" in Supabase Storage.`);
    if(/row-level|policy|permission|not authorized|unauthorized/i.test(msg)) throw new Error(`Storage permission denied. Add an INSERT policy for authenticated users on storage.objects for bucket \"${SUPABASE_BUCKET}\".`);
    throw new Error(msg);
  }
  const {data}=bucket.getPublicUrl(path);
  if(!data?.publicUrl)throw new Error("Uploaded, but Supabase did not return a public URL. Make the music bucket public.");

}

   try{
     const marker=`/storage/v1/object/public/${SUPABASE_BUCKET}/`;
     const idx=t.audio.indexOf(marker);
     const path=idx>=0?t.audio.slice(idx+marker.length):null;
     if(path){
       const {data,error}=await supabaseClient.storage.from(SUPABASE_BUCKET).createSignedUrl(path,3600);
       if(!error&&data?.signedUrl){audio.src=data.signedUrl;audio.load();if(autoplay){await audio.play();state.isPlaying=true;updatePlayer();return}}
     }
   }catch(err){console.warn("Signed audio fallback failed",err)}
 }
 state.isPlaying=false;updatePlayer();toast("Audio could not be loaded. Check the Supabase Storage file or browser support.");
}
async function playFirst(shuffle=false){let list=filtered();if(!list.length)return toast("No songs available.");let t=shuffle?list[Math.floor(Math.random()*list.length)]:list[0];await playTrack(t)}
async function next(){
 if(!state.currentTrack)return playFirst(state.isShuffle);
 if(state.repeatMode==="one"){audio.currentTime=0;await audio.play();return}
 if(state.queue.length){let id=state.queue.shift(),t=state.tracks.find(x=>x.id===id);if(t){await playTrack(t);render();return}}
 let list=filtered();if(!list.length)return;
 let idx=list.findIndex(t=>t.id===state.currentTrack.id), nextT;
 if(state.isShuffle){let choices=list.filter(t=>t.id!==state.currentTrack.id);nextT=choices[Math.floor(Math.random()*choices.length)]}
 else if(idx<list.length-1)nextT=list[idx+1];else if(state.repeatMode==="all")nextT=list[0];else{state.isPlaying=false;updatePlayer();return}
 await playTrack(nextT);render()
}
async function previous(){if(audio.currentTime>3){audio.currentTime=0;return}let list=filtered(),idx=list.findIndex(t=>t.id===state.currentTrack?.id);if(idx>0)await playTrack(list[idx-1]);else if(list.length)await playTrack(list[0])}
async function toggleLike(t){
 if(!t)return;
 const next=!t.liked;
 t.liked=next;
 try{
   if(t.remote&&supabaseUser) await setCloudLike(t);
   if(!t.remote&&!t.demo) await saveTrack(t);
   toast(next?"Added to Liked Songs":"Removed from Liked Songs");
 }catch(e){t.liked=!next;toast(e.message||"Could not sync liked song.");}
 render();
}
async function addToQueue(t){if(!t)return;if(state.queue.includes(t.id))return toast("Already in queue");state.queue.push(t.id);toast("Added to queue");renderQueue();render()}
function handleTrackClick(e){
 let row=e.target.closest(".track");if(!row)return;let t=state.tracks.find(x=>x.id===row.dataset.id);if(!t)return;
 let a=e.target.closest("[data-action]");if(!a){playTrack(t);return}
 if(a.dataset.action==="play")playTrack(t);else if(a.dataset.action==="like")toggleLike(t);else if(a.dataset.action==="queue")addToQueue(t)
}
function handleCardClick(e){let card=e.target.closest(".card");if(card){let t=state.tracks.find(x=>x.id===card.dataset.id);if(t)playTrack(t)}}
async function addSong(e){
 e?.preventDefault?.();
 const form=$("#uploadForm");
 if(!form)return toast("Upload form is not ready. Open Admin again.");
 if(!cloudAvailable())return toast("Supabase is not connected. Refresh the page.");
 if(!supabaseUser)return toast("Please sign in first.");
 if(!selectedAudio)return toast("Choose an MP3/audio file first.");
 const title=$("#songTitle")?.value.trim();
 const artist=$("#artist")?.value.trim();
 const album=$("#album")?.value.trim()||"Single";
 if(!title)return toast("Song title is required.");
 if(!artist)return toast("Artist is required.");
 const btn=form.querySelector('button[type="submit"]');
 if(btn){btn.disabled=true;btn.textContent="Uploading…";}
 const t={id:uid(),title,artist,album,audioBlob:selectedAudio,coverBlob:selectedCover||null,liked:false,createdAt:Date.now(),demo:false};
 try{
   await saveCloudSong(t);
   t.audioBlob=selectedAudio;t.coverBlob=selectedCover||null;
   await saveTrack(t).catch(()=>{});
   state.tracks=[...state.tracks.filter(x=>String(x.id)!==String(t.id)),t];
   selectedAudio=null;selectedCover=null;
   form.reset();
   const preview=$("#coverPreview");if(preview){const oldSrc=preview.src;preview.removeAttribute("src");preview.style.display="none";if(oldSrc?.startsWith("blob:"))URL.revokeObjectURL(oldSrc);}
   toast("✓ Song uploaded successfully");
   await refreshCloudLibrary(false);
 }catch(err){
   console.error("ADD SONG ERROR",err);
   toast(err?.message||"Upload failed. Check Supabase Storage and RLS policies.");
 }finally{
   if(btn){btn.disabled=false;btn.textContent="Add Song";}
 }
}
function confirmDelete(id){
 let t=state.tracks.find(x=>x.id===id);if(!t)return;state.pendingDelete=id;$("#modalTitle").textContent="Delete song?";$("#modalText").textContent=`“${t.title}” will be removed from your local music library.`;$("#modal").classList.add("show")
}
async function deleteSong(){
 if(!isAdminUser()){toast('Admin access is restricted.');return;}

 let id=state.pendingDelete,t=state.tracks.find(x=>x.id===id);if(!t)return;
 if(state.currentTrack?.id===id){audio.pause();audio.removeAttribute("src");state.currentTrack=null;state.isPlaying=false}
 state.queue=state.queue.filter(x=>x!==id);state.tracks=state.tracks.filter(x=>x!==id);
 try{if(!t.demo&&!t.remote)await idbDelete(id)}catch{}
 if(t.remote){try{await deleteCloudSong(t)}catch(err){console.warn("Cloud delete failed",err);toast(err.message||"Cloud delete failed");return}}
 ["a"+id,"c"+id].forEach(k=>{if(state.objectUrls.has(k)){URL.revokeObjectURL(state.objectUrls.get(k));state.objectUrls.delete(k)}})
 $("#modal").classList.remove("show");state.pendingDelete=null;toast("Song deleted");render()
}
$("#nav").onclick=e=>{let b=e.target.closest("button[data-section]");if(!b)return;if(b.dataset.section==="queue"){toggleQueue(true);return}state.currentSection=b.dataset.section;render();$("#main").scrollTo(0,0)}
$("#content").onclick=e=>{if(e.target.closest("[data-goto]")){state.currentSection=e.target.closest("[data-goto]").dataset.goto;render();return}if(e.target.closest("[data-edit]")){startEditSong(e.target.closest("[data-edit]").dataset.edit);return}if(e.target.closest("[data-delete]")){confirmDelete(e.target.closest("[data-delete]").dataset.delete);return}handleTrackClick(e);handleCardClick(e);let qa=e.target.closest("[data-qaction]");if(qa){let row=qa.closest(".queue-item"),t=state.tracks.find(x=>x.id===row.dataset.id);if(qa.dataset.qaction==="add")addToQueue(t);else{state.queue=state.queue.filter(id=>id!==t.id);render();}}if(e.target.id==="clearQueue"){state.queue=[];render()}}
$("#queueContent").onclick=e=>{let row=e.target.closest(".queue-item"),a=e.target.closest("[data-qaction]");if(a&&row){let t=state.tracks.find(x=>x.id===row.dataset.id);if(a.dataset.qaction==="add")addToQueue(t);else{state.queue=state.queue.filter(id=>id!==t.id);renderQueue()}}else if(row){let t=state.tracks.find(x=>x.id===row.dataset.id);if(t)playTrack(t)}if(e.target.id==="clearQueue"){state.queue=[];renderQueue()}}
function toggleQueue(force){$("#queuePanel").classList.toggle("open",force??!$("#queuePanel").classList.contains("open"))}

$("#accountBtn").onclick=()=>{state.currentSection="account";render();$("#main").scrollTo(0,0)};
$("#getPlus").onclick=()=>toast("VibroX Plus is coming soon.");
$("#queueBtn").onclick=()=>toggleQueue();$("#closeQueue").onclick=()=>toggleQueue(false);
$("#search").oninput=e=>{state.searchQuery=e.target.value;render()};
$("#playBtn").onclick=async()=>{if(!state.currentTrack)return playFirst();if(audio.paused){try{await audio.play();state.isPlaying=true}catch{} }else{audio.pause();state.isPlaying=false}updatePlayer()};
$("#nextBtn").onclick=next;$("#prevBtn").onclick=previous;
$("#progress").oninput=e=>{if(audio.duration)audio.currentTime=audio.duration*e.target.value/100;updatePlayer()};
$("#volume").oninput=e=>{state.volume=Number(e.target.value);audio.volume=state.volume;persistPrefs();updatePlayer()};
$("#muteBtn").onclick=()=>{audio.muted=!audio.muted;$("#volumeIcon").style.opacity=audio.muted?.45:1};
$("#shuffleBtn").onclick=()=>{state.isShuffle=!state.isShuffle;persistPrefs();updateShuffleUI();toast(state.isShuffle?"Shuffle on":"Shuffle off")};
$("#repeatBtn").onclick=()=>{state.repeatMode=state.repeatMode==="off"?"all":state.repeatMode==="all"?"one":"off";persistPrefs();updatePlayer();toast("Repeat "+state.repeatMode)};
$("#playerLike").onclick=()=>toggleLike(state.currentTrack);
audio.addEventListener("play",()=>{state.isPlaying=true;updatePlayer()});
audio.addEventListener("pause",()=>{state.isPlaying=false;updatePlayer()});
audio.addEventListener("timeupdate",updatePlayer);audio.addEventListener("loadedmetadata",updatePlayer);
audio.addEventListener("ended",next);audio.addEventListener("error",()=>{state.isPlaying=false;updatePlayer();toast("Audio could not be loaded. Check the file URL or Storage access.");});
$("#modalCancel").onclick=()=>{$("#modal").classList.remove("show");state.pendingDelete=null};$("#modalConfirm").onclick=deleteSong;
document.addEventListener("keydown",e=>{const tag=e.target?.tagName;const typing=tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT"||e.target?.isContentEditable;if(e.key==="Escape")toggleQueue(false);if(typing)return;if(e.code==="Space"&&tag!=="BUTTON"&&tag!=="A"){e.preventDefault();$("#playBtn").click()}if(e.key.toLowerCase()==="m")$("#muteBtn").click();if(e.key.toLowerCase()==="j")audio.currentTime=Math.max(0,audio.currentTime-5);if(e.key.toLowerCase()==="l")audio.currentTime=Math.min(audio.duration||Infinity,audio.currentTime+5);if(e.key.toLowerCase()==="n")next();if(e.key.toLowerCase()==="p")previous();});
window.addEventListener("beforeunload",()=>{for(let u of state.objectUrls.values())URL.revokeObjectURL(u)});

document.addEventListener("error",e=>{
  const img=e.target;
  if(img?.tagName==="IMG" && !img.dataset.fallback){img.dataset.fallback="1";img.src=DEFAULT_COVER;}
},true);

if(supabaseClient){
  supabaseClient.auth.onAuthStateChange((_event,session)=>{
    supabaseUser=session?.user||null;
    // Do not await Supabase queries inside onAuthStateChange; schedule them after the callback.
    setTimeout(async()=>{
      try{
        await loadCloudFavorites();
        if(supabaseUser) await refreshCloudLibrary(false);
      }catch(err){console.warn("Auth refresh failed",err);}
      if(state.currentSection==="account")render();
    },0);
  });
}

(async function init(){
  await restoreSupabaseSession();
 try{await openDB();await loadLibrary()}catch(e){console.error(e);state.tracks=[...DEMO];render();toast("IndexedDB is unavailable; uploaded music cannot be persisted.")}
})();
</script>
</body>
</html>
